name: tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
    tags:  
      - "*"
  workflow_dispatch:

concurrency:
{%- raw %}
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
{%- endraw %}
  cancel-in-progress: true

permissions: {}

env:
  PYTHON_VERSIONS: 3.9 3.10 3.11 3.12 3.13 3.14
{%- if cookiecutter.crds_observatory != 'none' %}
  CRDS_PATH: /tmp/data/crds_cache
  CRDS_OBSERVATORY: {{ cookiecutter.crds_observatory }}
  CRDS_SERVER_URL: https://{{ cookiecutter.crds_observatory }}-crds.stsci.edu
  CRDS_CLIENT_RETRY_COUNT: 3
  CRDS_CLIENT_RETRY_DELAY_SECONDS: 20
{%- endif %}

jobs:
  supported-pythons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3"
      - run: pip install packaging tomli
      - name: convert Python version(s) into JSON list
        id: versions
        shell: python
        run: |
          import os
          import json

          import tomli
          from packaging.specifiers import SpecifierSet
          from packaging.version import Version

          with open("pyproject.toml", "rb") as pyproject_toml_file:
            version_requirements = SpecifierSet(tomli.load(pyproject_toml_file)["project"]["requires-python"])

          versions = [str(version) for version in sorted([Version(version) for version in os.environ["PYTHON_VERSIONS"].split() if version in version_requirements])]

          with open(os.environ["GITHUB_OUTPUT"], "a") as github_output:
              print(f"json={json.dumps(versions)}", file=github_output)
              print(f"oldest={versions[0]}", file=github_output)
              print(f"latest={versions[-1]}", file=github_output)
    outputs:
{%- raw %}
      python-version-json: ${{ steps.versions.outputs.json }}
      oldest: ${{ steps.versions.outputs.oldest }}
      latest: ${{ steps.versions.outputs.latest }}
{%- endraw %}
{%- if cookiecutter.crds_observatory != 'none' %}
  crds:
    runs-on: ubuntu-latest
    steps:
{%- raw %}
      - id: latest-context
        run: >
          echo latest-context=$(
            curl -s -X POST -d '{"jsonrpc": "1.0", "method": "get_default_context", "params": ["${{ env.CRDS_OBSERVATORY }}", "latest"], "id": 1}' ${{ env.CRDS_SERVER_URL }}/json/ --retry 8 --connect-timeout 10 |
            python -c "import sys, json; print(json.load(sys.stdin)['result'])"
          ) >> $GITHUB_OUTPUT
    outputs:
      path: ${{ env.CRDS_PATH }}
      server-url: ${{ env.CRDS_SERVER_URL }}
      context: ${{ steps.latest-context.outputs.latest-context }}
      client-retry-count: ${{ env.CRDS_CLIENT_RETRY_COUNT }}
      client-retry-delay-seconds: ${{ env.CRDS_CLIENT_RETRY_DELAY_SECONDS }}
{%- endraw %}
{%- endif %}
  test:
    needs:
      - supported-pythons
{%- if cookiecutter.crds_observatory != 'none' %}
      - crds
{%- endif %}
{%- if cookiecutter.task_runner != 'tox' %}
    strategy:
      fail-fast: false
      matrix:
        runs-on: ["ubuntu-latest"]
{%- raw %}
        python-version: ${{ fromJSON(needs.supported-pythons.outputs.python-version-json) }}
        coverage: [false]
        include:
          - name: run tests (oldest supported Python, ubuntu-latest)
            runs-on: "ubuntu-latest"
            python-version: "${{ needs.supported-pythons.outputs.oldest }}"
          - name: run tests with coverage (latest supported Python, ubuntu-latest)
            runs-on: "ubuntu-latest"
            python-version: "${{ needs.supported-pythons.outputs.latest }}"
            coverage: true
          - name: run tests (latest supported Python, macos-latest)
            runs-on: "macos-latest"
            python-version: "${{ needs.supported-pythons.outputs.latest }}"
    name: ${{  matrix.name || format('run tests (Python {0}, {1})', matrix.python-version, matrix.runs-on) }}
    runs-on: ${{  matrix.runs-on }}
{%- endraw %}
{%- if cookiecutter.crds_observatory != 'none' %}
    env:
{%- raw %}
      CRDS_CONTEXT: ${{ needs.crds.outputs.context }}
{%- endraw %}
{%- endif %}
    steps:
{%- if cookiecutter.crds_observatory != 'none' %}
      - name: cache CRDS reference files retrieved during testing
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
{%- raw %}
          path: ${{ env.CRDS_PATH }}
          key: ${{ env.CRDS_CONTEXT }}
{%- endraw %}
{%- endif %}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
{%- if cookiecutter.task_runner == 'none' %}
{%- raw %}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[test]" ${{ matrix.coverage && 'coverage pytest-cov' || '' }}
      - run: pytest ${{ matrix.coverage && '--cov' || '' }}
{%- endraw %}
{%- elif cookiecutter.task_runner == 'nox' %}
      - uses: wntrblm/nox@afa3983bbac3143bab5c8406244327581f76a3d7 # 2026.10.20
        with:
{%- raw %}
          python-versions: ${{ matrix.python-version }}
      - run: nox -s "test${{ matrix.coverage && '-with-coverage' || '' }}"
{%- endraw %}
{%- endif %}
      - if: matrix.coverage
        name: report coverage to summary
        run: |
          coverage combine
          echo '## Coverage Report' >> $GITHUB_STEP_SUMMARY
          coverage report -i -m --format=markdown | tee -a $GITHUB_STEP_SUMMARY
{%- elif cookiecutter.task_runner == 'tox' %}
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@1285b95e32c783cfa40eb2ffbd6ca4cd023fb884 # v3.2.2
    with:
{%- if cookiecutter.crds_observatory != 'none' %}
      setenv: |
{%- raw %}
        CRDS_PATH: ${{ needs.crds.outputs.path }}
        CRDS_SERVER_URL: ${{ needs.crds.outputs.server-url }}
        CRDS_CONTEXT: ${{ needs.crds.outputs.context }}
        CRDS_CLIENT_RETRY_COUNT: ${{ needs.crds.outputs.client-retry-count }}
        CRDS_CLIENT_RETRY_DELAY_SECONDS: ${{ needs.crds.outputs.client-retry-delay-seconds }}
      cache-path: ${{ needs.crds.outputs.path }}
      cache-key: crds-${{ needs.crds.outputs.context }}
{%- endraw %}
{%- endif %}
      envs: |
{%- raw %}
        - name: run tests (oldest supported Python, ubuntu-latest)
          linux: py3
          python-version: ${{ needs.supported-pythons.outputs.oldest }}
        - linux: py*
        - name: run tests with coverage (latest supported Python, ubuntu-latest)
          linux: py3-cov
          python-version: ${{ needs.supported-pythons.outputs.latest }}
          pytest-results-summary: true
          coverage: github
        - name: run tests (latest supported Python, macos-latest)
          macos: py3
          python-version: ${{ needs.supported-pythons.outputs.latest }}
{%- endraw %}
      artifact-path: |
        results.xml
{%- endif %}
