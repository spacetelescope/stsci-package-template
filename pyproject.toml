[project]
name = "packagename"
description = "My pretty cool package"
requires-python = ">=3.11"
license-files = ["LICENSE.rst"]
authors = [{ name = "Author1" }]
classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["numpy>=1.25", "astropy>=4"]
dynamic = ["version"]

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.urls]
Homepage = "https://github.com/spacetelescope/packagename"
Documentation = "https://packagename.readthedocs.io/en/stable/"

[project.optional-dependencies]
test = ["pytest>=9.0.0", "pytest-cov>=2.9.0", "pytest-doctestplus>=0.11"]
docs = [
  "numpydoc",
  "sphinx",
  "sphinxcontrib-jquery",
  "sphinx-automodapi",
  "sphinx-rtd-theme>1.2.0",
  "pytest-doctestplus>=0.11",
]

[project.scripts]
stsci_package_template_example = "packagename.example_mod:main"

[build-system]
requires = ["setuptools>=61.2", "setuptools_scm[toml]>=3.4", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false

[tool.setuptools.package-data]
packagename = ["data/*"]

[tool.setuptools_scm]

[tool.pytest]
minversion = "9.0"
norecursedirs = [
  "docs/_build",
  "docs/exts",
  "scripts",
  ".tox",
  ".eggs",
  "build",
  "venv",
]
junit_family = "xunit2"
text_file_format = "rst"
doctest_plus = "enabled"
doctest_rst = "enabled"
addopts = ["-p no:legacypath", "--show-capture=no", "--color=yes"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["packagename"]
omit = [
  "packagename/tests/*",
  "packagename/version*",
  "*/packagename/tests/*",
  "*/packagename/version*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "except ImportError",
  "raise AssertionError",
  "raise NotImplementedError",
  "def main\\(.*\\):",
  "pragma: py{ignore_python_version}",
  "def _ipython_key_completions_",
]
