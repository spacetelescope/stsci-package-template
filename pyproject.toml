[project]
name = "stsci_package_template"
description = "Python library to assist with automatons in packages based off the stsci-package-template"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE"]
authors = [{ name = "STScI" }]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "nox>=2026.8",
  "packaging>=26.3",
  "requests>=2.34",
  "tomlkit>=0.15",
]
dynamic = ["version"]

[project.urls]
documentation = "https://spacetelescope.github.io/stsci-package-template"
repository = "https://github.com/spacetelescope/stsci-package-template"

[project.optional-dependencies]
contrib = ["nox", "pyrefly", "ruff"]
docs = ["numpydoc", "pytest_doctestplus>=1.7", "sphinx", "sphinx-autoapi", "sphinx-rtd-theme", "towncrier"]
test = [
  "coverage>=7.15",
  "pytest>=9.0",
  "pytest_doctestplus>=1.7",
  "cookiecutter>=2.6",
  "GitPython>=3.2",
]

[build-system]
requires = [
  "hatch-vcs",
  "hatchling>=1.20",
]
build-backend = "hatchling.build"

[tool.cibuildwheel]
build = "py31*"

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/", "tests/"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50
exclude_also = [
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
  "@overload",
  "@typing.overload",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
  "raise NotImplementedError",
  "\\.\\.\\.",
]

[tool.cruft]
skip = ["**/__init__.py", "tests/*"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "release-branch-semver"
# Used when building from a git archive without describe info (e.g. the setup-nox action)
fallback_version = "0.0.0"

[tool.pytest]
minversion = "9"
testpaths = ["tests", "src", "docs"]
