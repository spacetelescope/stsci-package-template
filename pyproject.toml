[project]
name = "stsci_package_template"
description = "Python library to assist with automatons in packages based off the stsci-package-template"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE"]
authors = [{ name = "STScI" }]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = []
dynamic = ["version"]

[project.urls]
documentation = "https://spacetelescope.github.io/stsci-package-template"
repository = "https://github.com/spacetelescope/stsci-package-template"

[project.optional-dependencies]
contrib = ["nox", "pyrefly", "ruff"]
docs = ["numpydoc", "pytest_doctestplus", "sphinx", "sphinx-autoapi", "sphinx-rtd-theme", "towncrier"]
test = ["coverage", "pytest>=9", "pytest_doctestplus", "cookiecutter"]

[build-system]
requires = [
  "hatch-vcs",
  "hatchling>=1.20",
]
build-backend = "hatchling.build"

[tool.cibuildwheel]
build = "py31*"

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/", "tests/"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50
exclude_also = [
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
  "@overload",
  "@typing.overload",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
  "raise NotImplementedError",
  "\\.\\.\\.",
]

[tool.cruft]
skip = ["**/__init__.py", "tests/*"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "release-branch-semver"

[tool.numpydoc_validation]
checks = [
  "all",
  "EX01",  # No examples section found
  "SA01",  # See Also section not found
  "ES01",  # No extended summary found
  "GL08",  # Object does not have a docstring. Ruff catches these, and allows more granular ignores.
  "PR01",  # Parameters not documented. Already caught by ruff.
  "PR09",  # Parameter description should finish with a period
  "RT02",  # First line of return should contain only the type
  "RT05",  # Return value description should finish with a period
]

[tool.pytest]
minversion = "9"
