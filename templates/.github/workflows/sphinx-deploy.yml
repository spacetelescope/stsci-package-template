name: Deploy documentation to GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-deploy
  cancel-in-progress: false # Let in-flight deployments finish to avoid a half-deployed site.

jobs:
  docs:
    # TODO: Pin to a release tag after the reusable workflow is merged into main.
    uses: spacetelescope/stsci-package-template/.github/workflows/reusable-sphinx-deploy.yml@f42361b8b0de4131384c2e4cf295d1dd73f2cf35
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      use-docs-extra: {% if cookiecutter.python_version is defined %}true{% else %}false{% endif %}
