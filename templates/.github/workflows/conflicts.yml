{%- raw -%}
name: upstream template conflicts

on:
  pull_request:
    paths:
      - "**.rej"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conflicts:
    # TODO: Pin to a release tag after the reusable workflow is merged into main.
    uses: spacetelescope/stsci-package-template/.github/workflows/reusable-conflicts.yml@f42361b8b0de4131384c2e4cf295d1dd73f2cf35
{%- endraw %}
