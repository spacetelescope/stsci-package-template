name: Set up nox
description: Install uv and nox as a uv tool together with stsci-package-template from the same commit as this action

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
    - shell: bash
      env:
        TEMPLATE_ROOT: ${{ github.action_path }}/../../..
      run: uv tool install nox --with "$TEMPLATE_ROOT"
