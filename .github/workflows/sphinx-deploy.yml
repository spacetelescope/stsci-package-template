name: Deploy documentation to GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-deploy
  cancel-in-progress: false # Let in-flight deployments finish to avoid a half-deployed site.

jobs:
  docs:
    uses: ./.github/workflows/reusable-sphinx-deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      use-docs-group: false
