name: build

on:
  pull_request:
  release:
    types: [released]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    # TODO: Pin to a release tag after the reusable workflow is merged into main.
    uses: spacetelescope/stsci-package-template/.github/workflows/reusable-build.yml@f42361b8b0de4131384c2e4cf295d1dd73f2cf35
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      package_name: stsci_package_template
      python_c_extensions: false
