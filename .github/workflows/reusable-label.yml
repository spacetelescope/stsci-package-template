name: Reusable GitHub Pull Request Label

on:
  workflow_call:

permissions:
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        if: github.event_name == 'pull_request_target'
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
